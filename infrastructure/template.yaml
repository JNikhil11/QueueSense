AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  QueueSense Serverless Production Infrastructure
  Techfest, IIT Bombay × AWS ShipIt Challenge
  Real-Time Campus Dining & Queue Intelligence Platform

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment stage name
  TableName:
    Type: String
    Default: QueueSense-Main
    Description: DynamoDB single-table name
  CustomDomainOrigin:
    Type: String
    Default: ''
    Description: Optional custom domain origin for production CORS (e.g. https://queuesense.campus.edu)
  CampusId:
    Type: String
    Default: iitb
    Description: Campus institution identifier (e.g. iitb, vitap)
  AlarmNotificationEmail:
    Type: String
    Default: ''
    Description: Optional email address for operational CloudWatch alarm notifications

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        ENVIRONMENT: !Ref Environment
        CAMPUS_ID: !Ref CampusId
        USER_POOL_ID: !Ref QueueSenseUserPool
        USER_POOL_CLIENT_ID: !Ref QueueSenseUserPoolClient

Resources:
  # ==========================================
  # Storage: DynamoDB Single-Table Design
  # ==========================================
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TableName}-${Environment}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: QueueSense
        - Key: Challenge
          Value: Techfest-AWS-ShipIt

  # ==========================================
  # Identity: Cognito User Pool (Admin Auth)
  # ==========================================
  QueueSenseUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "queuesense-users-${Environment}"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolTags:
        Project: QueueSense

  QueueSenseUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "queuesense-client-${Environment}"
      UserPoolId: !Ref QueueSenseUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  QueueSenseAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: Campus Dining Operations Administrators
      UserPoolId: !Ref QueueSenseUserPool
      Precedence: 1

  # ==========================================
  # Frontend Hosting: Private S3 + CloudFront OAC
  # ==========================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "queuesense-frontend-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentFrontendVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: QueueSense

  FrontendResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "queuesense-security-headers-${Environment}"
        Comment: "QueueSense Strict Security Headers Policy"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' https://*.amazonaws.com https://*.execute-api.*.amazonaws.com;"
            Override: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "queuesense-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "QueueSense Frontend Distribution (${Environment})"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        PriceClass: PriceClass_100
      Tags:
        - Key: Project
          Value: QueueSense

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ==========================================
  # API Gateway: HTTP API with CORS & Throttling
  # ==========================================
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/queuesense-api-${Environment}"
      RetentionInDays: 30

  QueueSenseHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "queuesense-api-${Environment}"
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","latency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","integrationStatus":"$context.integrationStatus","integrationErrorMessage":"$context.integrationErrorMessage"}'
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Idempotency-Key
          - X-Device-ID
          - X-Client-Instance-ID
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50.0
      RouteSettings:
        "POST /locations/{id}/reports":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10.0
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${QueueSenseUserPool}"
              audience:
                - !Ref QueueSenseUserPoolClient

  # ==========================================
  # Lambda Functions
  # ==========================================

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.health.app.lambda_handler
      ReservedConcurrentExecutions: 10
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /health
            Method: GET

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${HealthFunction}"
      RetentionInDays: 30

  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_locations.app.lambda_handler
      ReservedConcurrentExecutions: 50
      Policies:
        - Statement:
            - Sid: GetLocationsDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem # Required strictly for save_current_estimate (ESTIMATE#CURRENT cache warming on read miss); location seeding is NEVER executed on read path
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/GSI1"
      Events:
        ListLocations:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations
            Method: GET

  GetLocationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetLocationsFunction}"
      RetentionInDays: 30

  GetQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_queue.app.lambda_handler
      ReservedConcurrentExecutions: 50
      Policies:
        - Statement:
            - Sid: GetQueueDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/GSI1"
      Events:
        GetQueueDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/queue
            Method: GET
        GetLocationInfo:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}
            Method: GET

  GetQueueFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetQueueFunction}"
      RetentionInDays: 30

  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.submit_report.app.lambda_handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          RATE_LIMIT_SALT_PARAMETER_NAME: !Sub "/queuesense/${Environment}/rate_limit_salt"
      Policies:
        - Statement:
            - Sid: SubmitReportDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/GSI1"
            - Sid: SubmitReportSSMParameterAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/queuesense/${Environment}/rate_limit_salt"
            - Sid: SubmitReportKMSDecryptionAccess
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:CallerAccount: !Sub "${AWS::AccountId}"
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
                  kms:EncryptionContext:aws:ssm:arn: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/queuesense/${Environment}/rate_limit_salt"
      Events:
        SubmitObservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/reports
            Method: POST

  SubmitReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SubmitReportFunction}"
      RetentionInDays: 30

  GetRecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_recommendations.app.lambda_handler
      ReservedConcurrentExecutions: 30
      Policies:
        - Statement:
            - Sid: GetRecommendationsDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem # Required strictly for save_current_estimate (ESTIMATE#CURRENT cache warming on read miss); location seeding is NEVER executed on read path
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/GSI1"
      Events:
        FetchRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /recommendations
            Method: GET

  GetRecommendationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetRecommendationsFunction}"
      RetentionInDays: 30

  GetHistoricalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_historical.app.lambda_handler
      ReservedConcurrentExecutions: 20
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${TableName}-${Environment}"
      Events:
        GetHistoricalPatterns:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/historical
            Method: GET

  GetHistoricalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetHistoricalFunction}"
      RetentionInDays: 30

  AdminReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.admin.app.lambda_handler
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          USER_POOL_ID: !Ref QueueSenseUserPool
          USER_POOL_CLIENT_ID: !Ref QueueSenseUserPoolClient
      Policies:
        - Statement:
            - Sid: AdminReportsDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/GSI1"
      Events:
        AdminAuditFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /admin/reports
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  AdminReportsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AdminReportsFunction}"
      RetentionInDays: 30

  # ==========================================
  # Observability: CloudWatch Alarms
  # ==========================================
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "queuesense-api-5xx-${Environment}"
      AlarmDescription: "Alerts when API Gateway 5xx errors exceed threshold (>= 5 errors in 5 min)"
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref QueueSenseHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SubmitReportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "queuesense-submit-report-errors-${Environment}"
      AlarmDescription: "Alerts on sustained Lambda errors in SubmitReportFunction (>= 3 errors in 5 min)"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubmitReportFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DynamoDBThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "queuesense-dynamodb-throttles-${Environment}"
      AlarmDescription: "Alerts on any DynamoDB throttled requests (>= 1 in 5 min)"
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref MainTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  QueueReadLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "queuesense-queue-read-latency-${Environment}"
      AlarmDescription: "Alerts when GetQueueFunction average execution duration exceeds 3000ms"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetQueueFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL for QueueSense
    Value: !Sub "https://${QueueSenseHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontURL:
    Description: CloudFront Distribution URL for QueueSense Frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref FrontendDistribution
  FrontendBucketName:
    Description: Private S3 Bucket for Frontend Assets
    Value: !Ref FrontendBucket
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref QueueSenseUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref QueueSenseUserPoolClient
  DynamoDBTableName:
    Description: DynamoDB Single-Table Name
    Value: !Ref MainTable
  AwsRegion:
    Description: AWS Target Region
    Value: !Ref "AWS::Region"
