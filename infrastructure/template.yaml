AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  QueueSense Serverless Production Infrastructure
  Techfest, IIT Bombay × AWS ShipIt Challenge
  Real-Time Campus Dining & Queue Intelligence Platform

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment stage name
  TableName:
    Type: String
    Default: QueueSense-Main
    Description: DynamoDB single-table name
  CustomDomainOrigin:
    Type: String
    Default: ''
    Description: Optional custom domain origin for production CORS (e.g. https://queuesense.campus.edu)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        ENVIRONMENT: !Ref Environment
        USER_POOL_ID: !Ref QueueSenseUserPool
        USER_POOL_CLIENT_ID: !Ref QueueSenseUserPoolClient

Resources:
  # ==========================================
  # Storage: DynamoDB Single-Table Design
  # ==========================================
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableName}-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: QueueSense
        - Key: Challenge
          Value: Techfest-AWS-ShipIt

  # ==========================================
  # Identity: Cognito User Pool (Admin Auth)
  # ==========================================
  QueueSenseUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "queuesense-users-${Environment}"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolTags:
        Project: QueueSense

  QueueSenseUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "queuesense-client-${Environment}"
      UserPoolId: !Ref QueueSenseUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  QueueSenseAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: Campus Dining Operations Administrators
      UserPoolId: !Ref QueueSenseUserPool
      Precedence: 1

  # ==========================================
  # Frontend Hosting: Private S3 + CloudFront OAC
  # ==========================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "queuesense-frontend-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: QueueSense

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "queuesense-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "QueueSense Frontend Distribution (${Environment})"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        PriceClass: PriceClass_100
      Tags:
        - Key: Project
          Value: QueueSense

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ==========================================
  # API Gateway: HTTP API with CORS & Throttling
  # ==========================================
  QueueSenseHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "queuesense-api-${Environment}"
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Idempotency-Key
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50.0
      RouteSettings:
        "POST /locations/{id}/reports":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10.0
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${QueueSenseUserPool}"
              audience:
                - !Ref QueueSenseUserPoolClient

  # ==========================================
  # Lambda Functions
  # ==========================================

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.health.app.lambda_handler
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /health
            Method: GET

  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_locations.app.lambda_handler
      Policies:
        - Statement:
            - Sid: GetLocationsDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt MainTable.Arn
      Events:
        ListLocations:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations
            Method: GET

  GetQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_queue.app.lambda_handler
      Policies:
        - Statement:
            - Sid: GetQueueDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt MainTable.Arn
      Events:
        GetQueueDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/queue
            Method: GET
        GetLocationInfo:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}
            Method: GET

  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.submit_report.app.lambda_handler
      Environment:
        Variables:
          RATE_LIMIT_SALT_PARAMETER_NAME: !Sub "/queuesense/${Environment}/rate_limit_salt"
      Policies:
        - Statement:
            - Sid: SubmitReportDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt MainTable.Arn
            - Sid: SubmitReportSSMParameterAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/queuesense/${Environment}/rate_limit_salt"
      Events:
        SubmitObservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/reports
            Method: POST

  GetRecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_recommendations.app.lambda_handler
      Policies:
        - Statement:
            - Sid: GetRecommendationsDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt MainTable.Arn
      Events:
        FetchRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /recommendations
            Method: GET

  GetHistoricalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.get_historical.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${TableName}-${Environment}"
      Events:
        GetHistoricalPatterns:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /locations/{id}/historical
            Method: GET

  AdminReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.admin.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${TableName}-${Environment}"
      Events:
        AdminAuditFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueueSenseHttpApi
            Path: /admin/reports
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL for QueueSense
    Value: !Sub "https://${QueueSenseHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontURL:
    Description: CloudFront Distribution URL for QueueSense Frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref FrontendDistribution
  FrontendBucketName:
    Description: Private S3 Bucket for Frontend Assets
    Value: !Ref FrontendBucket
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref QueueSenseUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref QueueSenseUserPoolClient
  DynamoDBTableName:
    Description: DynamoDB Single-Table Name
    Value: !Ref MainTable
  AwsRegion:
    Description: AWS Target Region
    Value: !Ref "AWS::Region"
